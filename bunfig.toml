# NOTE: this file only affects `bun install`, and this repo installs with npm —
# `package-lock.json` is the authoritative lockfile and `bun.lock` was removed
# (it resolved every package from Lovable's private registry). The 24h guard
# below is therefore inert today. It is kept so the policy survives if the repo
# moves back to bun; npm has no built-in equivalent.
[install]
saveTextLockfile = true
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any.
minimumReleaseAgeExcludes = []
